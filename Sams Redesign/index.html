
<head>
    <title>Sams Portal</title>
</head>
<link rel="StyleSheet" href="style.css">
<body class="login">
    <div class="left">
        <div class="logo">

        </div>

    </div>
    <div class="right">
        <div class="main">
            <!-- Title -->   
            <p>
                <span class="sams login-actions">SAMS</span>
                <span class="portal login-actions">PORTAL</span>
            </p>
            <!-- Id number Icon -->   
            <div class="login-row login-actions">
                <img src="user.png" class="icons">
                <input class="idnumber" placeholder="Student ID Number" >
            </div>
            
            <!-- Password -->  
            <div class="login-row login-actions">
                <img src="password.png" class="icons">
                <input class="password" placeholder="Password" type="password">
            
            </div> 
            
            <!-- Login -->   
            <div class="login-row login-actions">
                <button class="button" style="font-size: 20px ; ">Log in</button>
                <a href="" class="forgot">Forgot Password?</a>
            </div>
            <!--New user-->
            <div class="newuser">
                <p style="font-weight: bolder;">New Students or Transferees only</p>
                <p>Don't have a SAMS account yet? Click <a href="" style="decoration: underline;">here</a> to enroll now!</p>
            </div>

        </div>
        
    </div>
  
</body>
